mamba:
    ssm_type: "S6-Complex"
    n_layers: 3
    d_model: 64
    d_state: 32
    d_conv: 4
    expand_factor: 2
    bidirectional: False
    dt_is_selective: True
    B_is_selective: True
    C_is_selective: True
    param_A_imag: "normal"
    deterministic: False
    pscan: False
    initA_imag: "S4"
    initA_real: "S6"
    channel_sharing: True
    dt_rank: 'auto'
    use_cuda: True

model:
  num_classes: 10
  n_input: 1
  n_layers: 1
  pooling_factor: 1

train:
  batch_size: 16
  lr: 0.001
  epochs: 30
  is_mel: False
