mamba:
    ssm_type: "S6-Complex"
    n_layers: 8
    d_model: 512
    d_state: 128
    d_conv: 4
    expand_factor: 2
    bidirectional: False
    dt_is_selective: True
    B_is_selective: True
    C_is_selective: True
    param_A_imag: "normal"
    deterministic: False
    pscan: False
    initA_imag: "S4"
    initA_real: "S4"
    channel_sharing: True
    dt_rank: 'auto'
    use_cuda: True
    conj_sym: True

train:
  batch_size: 32
  block_size: 512
  lr: 3e-4
  epochs: 100
  tokenizer: "gpt2"
  weight_decay: 0.01